<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TYKR | Something Exciting is Under Wraps</title>
    <style>
        :root {
            --bg-color: #0B0F17;
            --text-primary: #F3F4F6;
            --text-secondary: #9CA3AF;
            --accent-teal: #00F2FE;
            --accent-volt: #4FACFE;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2rem;
            overflow: hidden;
            position: relative;
        }

        /* Abstract glowing background grid */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(0, 242, 254, 0.03) 0%, transparent 60%);
            z-index: 1;
            pointer-events: none;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 2;
            margin-auto: auto;
            max-width: 600px;
            margin-top: auto;
            margin-bottom: auto;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 0.3em;
            background: linear-gradient(135deg, var(--accent-teal), var(--accent-volt));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
        }

        p {
            color: var(--text-secondary);
            font-size: 1.125rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .domain {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 242, 254, 0.15);
            border-radius: 9999px;
            font-family: monospace;
            font-size: 1rem;
            color: var(--accent-teal);
            letter-spacing: 0.05em;
        }

        footer {
            z-index: 2;
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
            margin-top: auto;
        }

        footer span {
            color: #EF4444; /* Heart icon red */
        }
    </style>
</head>
<body>

    <main>
        <div class="logo">TYKR</div>
        <h1>Something exciting is under wraps.</h1>
        <p>We are building the next era of trading. No-code strategies verified on tick-level truth, mirrored in real-time.</p>
        <div class="domain">tykrtrader.com</div>
    </main>

    <footer>
        <p>With <span>♥</span> Sai & Todd</p>
    </footer>

</body>
</html>
